name: Publicar blog Hugo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Instalar Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.167.0'
          extended: true

      - name: Construir blog
        run: hugo --minify --baseURL "https://monicachance1225-create.github.io/bloc-notas/"

      - name: Preparar archivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar blog
        id: deployment
        uses: actions/deploy-pages@v4
